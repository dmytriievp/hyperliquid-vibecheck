<title>Hyperliquid Vibe Check</title>
<meta property="og:image" content="https://hyperliquidvibecheck.xyz/og.png"/>
<meta property="og:url" content="https://hyperliquidvibecheck.xyz"/>
<meta name="twitter:image" content="https://hyperliquidvibecheck.xyz/og.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&family=Fredoka+One&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" defer></script>
<style>
:root{
  --bg:#0a1410;
  --surface:#0d1f19;
  --surf2:#071510;
  --surf3:#112118;
  --teal:#4fd2c2;
  --teal2:#3a9e8f;
  --white:#f0faf8;
  --muted:#8db5ae; /* was #6b9990 — lifted for WCAG AA contrast (~4.6:1 on --bg) */
  --border:rgba(79,210,194,0.14);
  --border2:rgba(79,210,194,0.07);
  /* Category colors — much more distinct */
  --c-btc:#4fd2c2;
  --c-alt:#f5a623;
  --c-stocks:#e05c8a;
  --c-indices:#7b6cf6;
  --c-comm:#4caf82;
  --c-fx:#e8833a;
  --c-preipo:#a78bfa;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--white);font-family:'DM Sans',sans-serif;font-size:15px;line-height:1.6;min-height:100vh}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(79,210,194,0.018) 1px,transparent 1px),linear-gradient(90deg,rgba(79,210,194,0.018) 1px,transparent 1px);background-size:48px 48px;pointer-events:none;z-index:0}
#app{position:relative;z-index:1;max-width:1500px;margin:0 auto;padding:28px 24px}

/* ── HEADER ── */
header{display:flex;align-items:center;justify-content:space-between;padding-bottom:20px;border-bottom:1px solid rgba(79,210,194,.18);margin-bottom:28px;flex-wrap:wrap;gap:12px}
.logo{font-family:'Space Mono',monospace;font-size:24px;font-weight:700;color:var(--teal);letter-spacing:-1px}
.logo span{color:var(--white)}
.tagline{font-size:11px;color:var(--muted);font-family:'Space Mono',monospace;letter-spacing:.1em;text-transform:uppercase;margin-top:3px}
.header-meta{font-family:'Space Mono',monospace;font-size:11px;color:var(--muted);text-align:right;line-height:1.9}
.header-meta .hl{color:var(--teal);font-weight:700}
.live-dot{width:8px;height:8px;background:#4fd2c2;border-radius:50%;display:inline-block;margin-right:6px;animation:pulse 2s ease-in-out infinite;vertical-align:middle}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(79,210,194,.5)}50%{opacity:.5;box-shadow:0 0 0 6px rgba(79,210,194,0)}}

/* ── SETUP BANNER ── */
.setup-banner{background:rgba(79,210,194,.05);border:1px solid rgba(79,210,194,.18);border-radius:10px;padding:14px 18px;margin-bottom:22px;font-family:'Space Mono',monospace;font-size:11px;line-height:1.9;color:var(--muted)}
.setup-banner strong{color:var(--teal);display:block;margin-bottom:4px;font-size:12px}
.setup-banner code{background:rgba(79,210,194,.1);padding:1px 6px;border-radius:3px;color:var(--white)}
.setup-banner .dismiss{float:right;cursor:pointer;color:var(--teal2)}

/* ── TIMEFRAME ── */
.controls-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 20px}
.controls-left{font-family:'Space Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:.06em;line-height:1.7}
.tf-row{display:flex;gap:4px}
.tf-btn{font-family:'Space Mono',monospace;font-size:11px;padding:10px 18px;min-height:44px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;transition:all .15s;font-weight:700;letter-spacing:.04em}
.tf-btn.active{background:var(--teal);border-color:var(--teal);color:#071510}
.tf-btn:hover:not(.active){border-color:var(--teal2);color:var(--teal)}

/* ── SECTION HEADER — prominent ── */
.section-header{margin:28px 0 16px;display:flex;align-items:baseline;gap:12px}
.section-title{font-family:'Space Mono',monospace;font-size:18px;font-weight:700;color:var(--white);letter-spacing:-.2px}
.section-subtitle{font-family:'Space Mono',monospace;font-size:11px;color:var(--teal);letter-spacing:.12em;text-transform:uppercase;opacity:.8}
.section-line{flex:1;height:1px;background:linear-gradient(90deg,var(--teal2),transparent);opacity:.3;margin-left:8px}

/* ── SUB TAG ── */
.sub-divider{display:flex;align-items:center;gap:10px;margin:14px 0 10px}
.sub-divider::after{content:'';flex:1;height:1px;background:var(--border)}
.sub-tag{font-family:'Space Mono',monospace;font-size:11px;font-weight:700;color:var(--bg);background:var(--teal2);padding:4px 12px;border-radius:4px;letter-spacing:.08em}

/* ── METRIC ROW ── */
.metric-row{display:grid;grid-template-columns:1fr 280px;gap:16px;margin-bottom:16px;align-items:stretch}

/* ── KPI CARDS ── */
.kpi-grid{display:grid;gap:10px;height:100%}
.kpi-grid.crypto-grid{grid-template-columns:repeat(2,1fr)}
.kpi-grid.tradfi-grid{grid-template-columns:repeat(5,1fr)}

.kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;position:relative;overflow:hidden;transition:border-color .2s,transform .15s;cursor:default}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent,var(--teal))}
.kpi-card::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at top left,var(--accent-glow,rgba(79,210,194,.04)),transparent 70%);pointer-events:none}
.kpi-card:hover{border-color:var(--accent,var(--teal));border-opacity:.4;transform:translateY(-2px)}

/* Parent/total card — more prominent */
.kpi-card.parent{background:var(--surf3);border:1px solid var(--accent,var(--teal));border-opacity:.3}
.kpi-card.parent .kpi-pct{font-size:30px;font-variant-numeric:tabular-nums}
.kpi-card.parent .kpi-abs{font-size:13px;color:var(--white)}

.kpi-cat{font-family:'Space Mono',monospace;font-size:10px;font-weight:700;color:var(--accent,var(--teal));letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}
.kpi-pct{font-family:'Space Mono',monospace;font-size:28px;font-weight:700;color:var(--white);line-height:1;margin-bottom:5px;font-variant-numeric:tabular-nums}
.kpi-abs{font-size:12px;color:var(--teal2);font-family:'Space Mono',monospace;font-weight:400}
.kpi-metric-label{font-family:'Space Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;position:absolute;top:12px;right:12px;opacity:.7}

/* ── PIE CARD ── */
.pie-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;cursor:pointer;transition:all .2s;height:100%;display:flex;flex-direction:column}
.pie-card:hover{border-color:rgba(79,210,194,.3);transform:translateY(-1px)}
.pie-card-title{font-family:'Space Mono',monospace;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.pie-card-title span{font-size:10px;color:var(--teal);opacity:.8}
.pie-wrap{position:relative;width:100%;max-width:170px;margin:0 auto}
.pie-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none}
.pie-center-val{font-family:'Space Mono',monospace;font-size:12px;font-weight:700;color:var(--teal);line-height:1}
.pie-center-lbl{font-family:'Space Mono',monospace;font-size:10px;color:var(--muted);margin-top:3px}
.pie-legend{margin-top:10px;display:flex;flex-direction:column;gap:5px}
.pie-legend-item{display:flex;align-items:center;gap:7px}
.pie-legend-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.pie-legend-lbl{color:var(--muted);flex:1;font-family:'Space Mono',monospace;font-size:11px}
.pie-legend-val{color:var(--white);font-family:'Space Mono',monospace;font-size:11px;font-weight:700}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(16px);background:rgba(7,21,16,.7);animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-box{background:#0d1e19;border:1px solid rgba(79,210,194,.3);border-radius:16px;padding:32px;width:min(580px,92vw);position:relative;animation:scaleIn .2s ease;box-shadow:0 0 60px rgba(79,210,194,.08)}
@keyframes scaleIn{from{transform:scale(.93);opacity:0}to{transform:scale(1);opacity:1}}
.modal-close{position:absolute;top:16px;right:16px;font-family:'Space Mono',monospace;font-size:11px;color:var(--muted);cursor:pointer;background:none;border:1px solid var(--border);border-radius:4px;padding:4px 12px;transition:all .15s}
.modal-close:hover{color:var(--teal);border-color:var(--teal)}
.modal-title{font-family:'Space Mono',monospace;font-size:13px;font-weight:700;color:var(--teal);letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.modal-subtitle{font-family:'Space Mono',monospace;font-size:10px;color:var(--muted);margin-bottom:22px;letter-spacing:.05em}
.modal-pie-wrap{position:relative;width:280px;margin:0 auto 22px}
.modal-pie-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none}
.modal-pie-center-val{font-family:'Space Mono',monospace;font-size:18px;font-weight:700;color:var(--teal)}
.modal-pie-center-lbl{font-family:'Space Mono',monospace;font-size:11px;color:var(--muted);margin-top:3px}
.modal-legend{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px}
.modal-legend-item{display:flex;align-items:center;gap:8px}
.modal-legend-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.modal-legend-lbl{color:var(--muted);flex:1;font-family:'Space Mono',monospace;font-size:11px}
.modal-legend-val{color:var(--white);font-family:'Space Mono',monospace;font-size:11px;font-weight:700}

/* ── STACKED BARS ── */
.hist-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px}
.chart-title{font-family:'Space Mono',monospace;font-size:12px;font-weight:700;color:var(--white);letter-spacing:.06em;text-transform:uppercase;margin-bottom:16px}
.hist-notice{font-family:'Space Mono',monospace;font-size:10px;color:var(--muted);text-align:center;padding:10px;border:1px dashed var(--border);border-radius:6px;margin-bottom:12px}

/* ── LOADING/ERROR ── */
.loading{display:flex;align-items:center;justify-content:center;min-height:280px;flex-direction:column;gap:16px}
.loading-bar{width:200px;height:2px;background:var(--border);border-radius:1px;overflow:hidden}
.loading-bar::after{content:'';display:block;width:70px;height:100%;background:var(--teal);animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-70px)}100%{transform:translateX(200px)}}
.loading-text{font-family:'Space Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:.12em}
.error-box{font-family:'Space Mono',monospace;font-size:11px;color:#ff7070;padding:20px;border:1px solid rgba(255,112,112,.2);border-radius:10px;background:rgba(255,112,112,.04);line-height:2}
.error-box code{background:rgba(255,112,112,.1);padding:1px 6px;border-radius:3px}

@media(max-width:1000px){.metric-row{grid-template-columns:1fr}.hist-grid{grid-template-columns:1fr}}
@media(max-width:700px){.kpi-grid.crypto-grid,.kpi-grid.tradfi-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px) and (min-width:701px){.kpi-grid.tradfi-grid{grid-template-columns:repeat(3,1fr)}}


/* ── VIBE GAUGE ── */
.vibe-hero{background:linear-gradient(170deg,#0f2820 0%,#071510 55%,#0c1e18 100%);border:1px solid rgba(79,210,194,.25);border-radius:16px;padding:32px 36px 24px;margin-bottom:32px;position:relative;overflow:hidden;text-align:center;box-shadow:0 4px 40px rgba(0,0,0,.4)}
.vibe-hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 120%,rgba(79,210,194,.06) 0%,transparent 65%);pointer-events:none}
.vibe-title{font-family:'Space Mono',monospace;font-size:13px;font-weight:700;color:var(--white);letter-spacing:.12em;text-transform:uppercase;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:600px){.vibe-title{font-size:11px;letter-spacing:.05em;white-space:normal;text-overflow:clip}}
.vibe-gauge-wrap{position:relative;width:100%;max-width:520px;margin:0 auto}
.vibe-gauge-labels{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px;padding:0 8px}
.vibe-label{font-family:'Space Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.vibe-label.tradfi{color:#e8833a}
.vibe-label.crypto{color:#4fd2c2}
.vibe-label .pct{font-size:34px;display:block;line-height:1;margin-top:6px;font-weight:700;font-variant-numeric:tabular-nums}
.vibe-label .abs{font-size:12px;color:var(--muted);font-weight:400;margin-top:5px}
.vibe-canvas-wrap{position:relative}
.vibe-needle-label{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none;white-space:nowrap}
.vibe-needle-val{font-family:'Space Mono',monospace;font-size:17px;font-weight:700;color:var(--teal);line-height:1}
.vibe-needle-sub{font-family:'Space Mono',monospace;font-size:11px;color:var(--muted);margin-top:3px;letter-spacing:.06em;text-transform:uppercase}
.vibe-tagline{font-family:'Space Mono',monospace;font-size:13px;color:var(--teal2);margin-top:14px;letter-spacing:.05em;line-height:1.6;padding:10px 16px;background:rgba(79,210,194,0.06);border-radius:8px;border:1px solid rgba(79,210,194,0.12);display:inline-block}
.vibe-tagline strong{color:var(--white)}
.vibe-share-btn{display:inline-flex;align-items:center;gap:6px;font-family:'Space Mono',monospace;font-size:10px;padding:6px 14px;border-radius:6px;background:transparent;border:1px solid var(--border);color:var(--muted);cursor:pointer;transition:all .15s;margin-top:14px;text-decoration:none}
.vibe-share-btn:hover{border-color:var(--teal2);color:var(--white)}
.vibe-share-btn svg{width:12px;height:12px;fill:currentColor;flex-shrink:0}
.vibe-tf-note{font-family:'Space Mono',monospace;font-size:10px;color:var(--muted);opacity:.7;margin-top:10px;letter-spacing:.05em}
/* ── FOCUS STATES (keyboard nav) ── */
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:4px}
button:focus-visible,.tf-btn:focus-visible,.nav-tab:focus-visible,.hl-btn:focus-visible{outline:2px solid var(--teal);outline-offset:3px}

/* ── NAV TABS ── */
.nav-tabs{display:flex;gap:4px;margin-bottom:0}
.nav-tab{font-family:'Space Mono',monospace;font-size:12px;font-weight:700;padding:10px 24px;min-height:40px;border-radius:6px 6px 0 0;border:1px solid var(--border);border-bottom:none;background:transparent;color:var(--muted);cursor:pointer;transition:all .15s;letter-spacing:.04em;position:relative;top:1px}
.nav-tab.active{background:var(--surface);color:var(--teal);border-color:var(--border)}
.nav-tab:hover:not(.active){color:var(--white)}
.page{display:none}.page.active{display:block}
.page-wrap{background:var(--surface);border:1px solid var(--border);border-radius:0 10px 10px 10px;padding:24px;overflow:hidden;margin-bottom:24px}

/* ── REFERRAL BUTTON ── */
.hl-btn{display:inline-flex;align-items:center;gap:8px;font-family:'Space Mono',monospace;font-size:12px;font-weight:700;padding:11px 24px;min-height:44px;border-radius:8px;background:var(--teal);color:#071510;text-decoration:none;letter-spacing:.04em;transition:all .2s;border:none;cursor:pointer}
.hl-btn:hover{background:#6fe0d0;transform:translateY(-1px);box-shadow:0 4px 20px rgba(79,210,194,.3)}
.hl-btn svg{width:14px;height:14px;flex-shrink:0}

/* ── FOOTER ── */
footer{border-top:1px solid var(--border);padding:24px 0 8px;margin-top:8px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px}
.footer-left{font-family:'Space Mono',monospace;font-size:11px;color:var(--muted);line-height:1.8}
.footer-left a{color:var(--teal);text-decoration:none}
.footer-left a:hover{color:var(--white)}
.footer-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.x-link{display:inline-flex;align-items:center;gap:7px;font-family:'Space Mono',monospace;font-size:11px;color:var(--muted);text-decoration:none;padding:7px 14px;border:1px solid var(--border);border-radius:6px;transition:all .15s}
.x-link:hover{color:var(--white);border-color:var(--teal2)}
.x-link svg{width:14px;height:14px;flex-shrink:0;fill:currentColor}

/* ── DOCS PAGE ── */
.docs-inner{padding:28px}
.docs-hero{margin-bottom:28px}
.docs-hero h2{font-family:'Space Mono',monospace;font-size:16px;font-weight:700;color:var(--white);margin-bottom:6px}
.docs-hero p{font-size:13px;color:var(--muted);line-height:1.7;max-width:680px}
.docs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-bottom:24px}
.docs-cat-card{background:var(--surf2);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.docs-cat-header{padding:14px 16px 10px;border-bottom:1px solid var(--border2);display:flex;align-items:center;gap:10px}
.docs-cat-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.docs-cat-name{font-family:'Space Mono',monospace;font-size:12px;font-weight:700;color:var(--white);letter-spacing:.04em}
.docs-cat-count{font-family:'Space Mono',monospace;font-size:11px;color:var(--muted);margin-left:auto}
.docs-cat-parent{font-family:'Space Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.docs-asset-list{padding:12px 16px;display:flex;flex-wrap:wrap;gap:5px}
.docs-asset-chip{font-family:'Space Mono',monospace;font-size:10px;color:var(--muted);background:rgba(79,210,194,.04);border:1px solid var(--border2);border-radius:3px;padding:2px 7px;transition:all .15s}
.docs-asset-chip:hover{color:var(--teal);border-color:rgba(79,210,194,.2)}
.docs-asset-chip.hip3{border-color:rgba(245,166,35,.15);color:rgba(245,166,35,.7)}
.docs-note{font-family:'Space Mono',monospace;font-size:10px;color:var(--muted);background:rgba(79,210,194,.04);border:1px solid var(--border2);border-radius:8px;padding:14px 16px;line-height:1.8}
.docs-note strong{color:var(--teal)}

/* ── SKELETON LOADER ── */
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skeleton-section{margin-bottom:28px}
.skeleton-label{height:12px;width:140px;border-radius:4px;background:var(--surf3);margin-bottom:16px}
.skeleton-row{display:grid;gap:10px;margin-bottom:10px}
.skeleton-row.two{grid-template-columns:1fr 280px}
.skeleton-row.crypto-kpi{grid-template-columns:1fr;gap:10px}
.skeleton-row.tradfi-kpi{grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:700px){.skeleton-row.tradfi-kpi{grid-template-columns:repeat(3,1fr)}}
.sk-card{height:90px;border-radius:10px;background:linear-gradient(90deg,var(--surface) 25%,var(--surf3) 50%,var(--surface) 75%);background-size:200% 100%;animation:shimmer 1.4s ease-in-out infinite;border:1px solid var(--border)}
.sk-card.parent{height:100px;grid-column:1/-1}
.sk-card.pie{height:240px;border-radius:10px}
.sk-card.gauge{height:320px;border-radius:16px;margin-bottom:28px}
.sk-card.controls{height:64px;border-radius:10px;margin-bottom:28px}

/* ── HISTORY EMPTY STATE ── */
.hist-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:160px;gap:10px;border:1px dashed var(--border);border-radius:10px}
.hist-empty-icon{font-size:28px;opacity:.4}
.hist-empty-msg{font-family:'Space Mono',monospace;font-size:11px;color:var(--muted);text-align:center;line-height:1.8}
</style>

// ─────────────────────────────────────────────────────────────────────────────
// HISTORICAL DATA via candleSnapshot
// Fetch 30 daily candles for key assets, aggregate by category per day
// Volume = base volume * close price (notional USD)
// ─────────────────────────────────────────────────────────────────────────────

// HIST_ASSETS is now derived dynamically from the live AC categorisation
// inside fetchHistoricalByDay(). This ensures historical coverage matches
// what's actually being shown on the live render — no more silent drops
// of TradFi assets (or anything else) that weren't in a hardcoded list.

let _histCache = null, _histCacheTime = 0;
const HIST_TTL = 60 * 60 * 1000;

async function fetchHistoricalByDay() {
  if (_histCache && Date.now() - _histCacheTime < HIST_TTL) return _histCache;

  // Derive asset list from live categorisation — every asset we render
  // a category for, we also fetch history for. Keeps 7D/30D in sync with 1D.
  const HIST_ASSETS = Object.keys(AC);

  const now   = Date.now();
  const start = now - 31 * 24 * 60 * 60 * 1000;
  const BATCH = 8;
  const allCandles = {};

  for (let i = 0; i < HIST_ASSETS.length; i += BATCH) {
    const batch = HIST_ASSETS.slice(i, i + BATCH);
    const results = await Promise.allSettled(batch.map(async coin => {
      const body = JSON.stringify({type:'candleSnapshot',req:{coin,interval:'1d',startTime:start,endTime:now}});
      let data;
      try {
        if (S.usingProxy) {
          const r = await fetch(`https://corsproxy.io/?${encodeURIComponent(HL_API)}`,{method:'POST',headers:{'Content-Type':'application/json','x-requested-with':'XMLHttpRequest'},body});
          data = await r.json();
        } else {
          const r = await fetch(HL_API,{method:'POST',headers:{'Content-Type':'application/json'},body});
          data = await r.json();
        }
        if (!Array.isArray(data)) return {coin, candles:[]};
        return {coin, candles: data.map(c => ({
          day: new Date(c.t).toLocaleDateString('en-US',{month:'short',day:'numeric'}),
          vol: parseFloat(c.v||0) * parseFloat(c.c||0),
        }))};
      } catch(e) { return {coin, candles:[]}; }
    }));
    results.forEach(r => { if(r.status==='fulfilled'&&r.value) allCandles[r.value.coin]=r.value.candles; });
    if (i + BATCH < HIST_ASSETS.length) await new Promise(res=>setTimeout(res,150));
  }

  // Collect all days, sort, take last 30
  const daySet = new Set();
  Object.values(allCandles).forEach(cs => cs.forEach(c => daySet.add(c.day)));
  // Sort by parsing as date (add current year for parsing)
  const days = Array.from(daySet).sort((a,b) => {
    const ya = new Date(a+','+new Date().getFullYear()), yb = new Date(b+','+new Date().getFullYear());
    return ya-yb;
  }).slice(-30);

  // Aggregate per day
  const byDay = days.map(day => {
    let totalVol=0; const catVol={};
    Object.entries(allCandles).forEach(([coin,cs]) => {
      const c = cs.find(x=>x.day===day); if(!c) return;
      totalVol += c.vol;
      // Unknown HIP-3 assets (dex:NAME) → default TradFi/Stocks so they're counted
      if(!AC[coin]) {
        if(coin.includes(':')) { const d=coin.split(':')[0]; if(d!=='hyna') { catVol['TradFi']=(catVol['TradFi']||0)+c.vol; catVol['Stocks']=(catVol['Stocks']||0)+c.vol; } }
        return;
      }
      ALL_CATS.forEach(dc => { if(!grp(coin,dc.key)) return; catVol[dc.key]=(catVol[dc.key]||0)+c.vol; });
    });
    return {day,totalVol,catVol};
  });

  _histCache = byDay; _histCacheTime = Date.now();
  console.log(`✓ History: ${days.length} days, ${HIST_ASSETS.length} assets`);
  return byDay;
}

function aggrFromHist(byDay, tf) {
  if(!byDay||byDay.length===0) return null;
  const n = tf==='1D'?1:tf==='7D'?7:30;
  const slice = byDay.slice(-n);
  if(!slice.length) return null;
  const totalVol = slice.reduce((a,d)=>a+d.totalVol,0);
  const catVol={};
  ALL_CATS.forEach(dc=>{ catVol[dc.key]=slice.reduce((a,d)=>a+((d.catVol||{})[dc.key]||0),0); });
  return {totalVol,catVol,nDays:slice.length};
}

async function hlPost(type,dex,proxy){
  const body=JSON.stringify(dex?{type,dex}:{type});
  if(proxy){
    const r=await fetch(`https://corsproxy.io/?${encodeURIComponent(HL_API)}`,{method:'POST',headers:{'Content-Type':'application/json','x-requested-with':'XMLHttpRequest'},body});
    return r.json();
  }
  const r=await fetch(HL_API,{method:'POST',headers:{'Content-Type':'application/json'},body});
  return r.json();
}

function parseDex(data){
  const assets=[];
  const meta=Array.isArray(data[0])?data[0]:(data[0]?.universe||[]);
  const ctx=Array.isArray(data[1])?data[1]:[];
  meta.forEach((a,i)=>{
    const c=ctx[i]||{};
    const px=parseFloat(c.markPx||c.oraclePx||c.prevDayPx||0);
    assets.push({name:a.name,volume:parseFloat(c.dayNtlVlm||0),oi:parseFloat(c.openInterest||0)*px});
  });
  return assets;
}

async function fetchAll(){
  const go=async(proxy)=>{
    const rs=await Promise.allSettled([
      hlPost('metaAndAssetCtxs',null,proxy),
      ...HIP3_DEXES.map(d=>hlPost('metaAndAssetCtxs',d,proxy))
    ]);
    if(rs[0].status!=='fulfilled') throw new Error(rs[0].reason?.message||'native failed');
    const assets=parseDex(rs[0].value);
    HIP3_DEXES.forEach((_,i)=>{
      const r=rs[i+1];
      if(r.status==='fulfilled'&&Array.isArray(r.value)) assets.push(...parseDex(r.value));
      else console.warn(HIP3_DEXES[i],'failed:',r.reason?.message);
    });
    return assets;
  };
  try{return await go(S.usingProxy);}
  catch(e){if(!S.usingProxy){console.warn('proxy fallback');S.usingProxy=true;return go(true);}throw e;}
}

// ─────────────────────────────────────────────────────────────────────────────
// AGGREGATION — with timeframe support
// ─────────────────────────────────────────────────────────────────────────────
function aggregate(assets){
  let tV=0,tO=0;const cV={},cO={};
  assets.forEach(a=>{
    tV+=a.volume;tO+=a.oi;
    if(!AC[a.name]) {
      // Unknown HIP-3 assets → default TradFi/Stocks
      if(a.name.includes(':')) { const d=a.name.split(':')[0]; if(d!=='hyna') { cV['TradFi']=(cV['TradFi']||0)+a.volume; cV['Stocks']=(cV['Stocks']||0)+a.volume; cO['TradFi']=(cO['TradFi']||0)+a.oi; cO['Stocks']=(cO['Stocks']||0)+a.oi; } }
      return;
    }
    ALL_CATS.forEach(d=>{
      if(!grp(a.name,d.key))return;
      cV[d.key]=(cV[d.key]||0)+a.volume;
      cO[d.key]=(cO[d.key]||0)+a.oi;
    });
  });
  return{totalVol:tV,totalOI:tO,catVol:cV,catOI:cO};
}

// Build aggregated view based on selected timeframe from history
// 1D = latest snapshot, 7D = sum last 7 days, 30D = sum last 30 days
// Volume (dayNtlVlm) is a rolling 24h figure — for 7D/30D we average across days
// OI is a point-in-time figure — for 7D/30D we average across snapshots
// getTimedAggr now delegates to candleSnapshot history for volume,
// and still uses live OI snapshot for OI (candleSnapshot has no OI)
function getTimedAggr(hist, tf) {
  return S.aggr; // OI always from live — hist candles used for vol separately
}

function $u(v){if(v>=1e9)return'$'+(v/1e9).toFixed(2)+'B';if(v>=1e6)return'$'+(v/1e6).toFixed(2)+'M';if(v>=1e3)return'$'+(v/1e3).toFixed(1)+'K';return'$'+v.toFixed(0)}
function $p(v,t){return t>0?((v/t)*100).toFixed(1)+'%':'0.0%'}
function $cd(s){return`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}

  const oiDays     = Object.entries(oiByDay).slice(-7);

  // Use candle days for labels if available, else OI days, else today
  let labels, volData, oiData;
  if (candleDays.length > 0) {
    labels  = candleDays.map(d=>d.day);
    volData = candleDays;
  } else if (oiDays.length > 0) {
    labels  = oiDays.map(([day])=>day);
    volData = null;
  } else {
    const today=new Date().toLocaleDateString('en-US',{month:'short',day:'numeric'});
    labels=[today];
    volData=[{day:today,...(fallbackAggr||{}),totalVol:fallbackAggr?.totalVol||0,catVol:fallbackAggr?.catVol||{}}];
  }

  // OI data: align to same labels from localStorage snapshots
  // If no OI history, use live snapshot for all days
  function mkOIDay(label) {
    const h = oiByDay[label];
    if (h) return h;
    return fallbackAggr ? {totalOI:fallbackAggr.totalOI,catOI:fallbackAggr.catOI} : {totalOI:0,catOI:{}};
  }

  function mkDs(field){
    return BAR_CATS.map(dc=>({
      label:dc.label,
      data:labels.map((label,i)=>{
        if(field==='vol'){
          const d=volData?volData[i]:null;
          const tot=d?d.totalVol:0;
          const val=d?(d.catVol||{})[dc.key]||0:0;
          return tot>0?parseFloat(((val/tot)*100).toFixed(2)):0;
        } else {
          const d=mkOIDay(label);
          const tot=d.totalOI||0;
          const val=(d.catOI||{})[dc.key]||0;
          return tot>0?parseFloat(((val/tot)*100).toFixed(2)):0;
        }
      }),
      backgroundColor:dc.color,
      stack:'s'
    }));
  }

  // Guard: don't render a broken single-bar chart — show a helpful empty state instead
  if (labels.length < 2) {
    ['vol-hist','oi-hist'].forEach(id=>{
      const el=document.getElementById(id); if(!el) return;
      if(S.charts[id]){S.charts[id].destroy();delete S.charts[id];}
      el.style.display='none';
      const card=el.closest('.chart-card'); if(!card) return;
      if(!card.querySelector('.hist-empty')) card.insertAdjacentHTML('beforeend',`
        <div class="hist-empty">
          <div class="hist-empty-icon">📊</div>
          <div class="hist-empty-msg">Building history…<br/>Check back after the first full UTC day of data.</div>
        </div>`);
    });
    return;
  }

  // Restore canvas visibility in case we previously hid it
  ['vol-hist','oi-hist'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.style.display='';
    const card=el?.closest('.chart-card');
    card?.querySelector('.hist-empty')?.remove();
  });

  ['vol-hist','oi-hist'].forEach((id,i)=>{
    const el=document.getElementById(id); if(!el) return;
    if(S.charts[id]) S.charts[id].destroy();
    S.charts[id]=new Chart(el.getContext('2d'),{
      type:'bar',
      data:{labels,datasets:mkDs(i===0?'vol':'oi')},
      options:{
        responsive:true,maintainAspectRatio:true,
        plugins:{
          legend:{display:true,position:'bottom',labels:{color:'#9ab8b4',font:{family:'Space Mono',size:10},boxWidth:10,boxHeight:10,padding:10}},
          tooltip:{backgroundColor:'#01241d',borderColor:'rgba(79,210,194,.2)',borderWidth:1,titleColor:'#4fd2c2',bodyColor:'#f8fcfd',
            callbacks:{label:c=>` ${c.dataset.label}: ${c.raw}%`}}
        },
        scales:{
          x:{stacked:true,grid:{color:'rgba(79,210,194,.03)'},ticks:{color:'#9ab8b4',font:{family:'Space Mono',size:10},maxRotation:45}},
          y:{stacked:true,min:0,max:100,grid:{color:'rgba(79,210,194,.05)'},ticks:{color:'#9ab8b4',font:{family:'Space Mono',size:10},callback:v=>v+'%'}}
        }
      }
    });
  });
}

async function refresh(){
  if(!S.aggr) showLoading();
  try{
    const assets=await fetchAll();
    S.aggr=aggregate(assets);
    S.history=saveH(S.aggr);
    S.countdown=3600;
    // Fetch historical candle data for timeframe toggle
    // Do this after initial render so page loads fast
    renderAll(S.aggr,S.history);
    fetchHistoricalByDay().then(byDay => {
      S.histByDay = byDay;
      renderAll(S.aggr, S.history); // re-render with real historical vol
    }).catch(e => console.warn('History fetch failed:', e.message));
  }catch(e){
    console.error(e);
    showError(`${e.message} — retrying in 60s`);
    S.countdown=60;
  }
}

setInterval(()=>{
  S.countdown=Math.max(0,S.countdown-1);
  const el=document.getElementById('cd');if(el) el.textContent=$cd(S.countdown);
  if(S.countdown===0) refresh();
},1000);

// ─────────────────────────────────────────────────────────────────────────────
// VIBE GAUGE — half-circle speedometer
// ─────────────────────────────────────────────────────────────────────────────
function drawGauge(cryptoPct, tradfiPct, totalVol, catVol) {
  // Text labels
  document.getElementById('gauge-crypto-pct').textContent = cryptoPct.toFixed(1) + '%';
  document.getElementById('gauge-tradfi-pct').textContent = tradfiPct.toFixed(1) + '%';
  document.getElementById('gauge-crypto-abs').textContent = $u(catVol['Crypto'] || 0);
  document.getElementById('gauge-tradfi-abs').textContent = $u(catVol['TradFi'] || 0);
  const dominance = cryptoPct > 65 ? 'crypto dominant' : cryptoPct > 52 ? 'slightly crypto' :
                    cryptoPct < 35 ? 'tradfi dominant' : cryptoPct < 48 ? 'slightly tradfi' : 'balanced';
  const taglines = {'crypto dominant':'▲ Degens in control — crypto volume leading',
    'slightly crypto':'↗ Leaning crypto — traders favour on-chain assets',
    'balanced':'= Balanced market — crypto and tradfi neck and neck',
    'slightly tradfi':'↘ Leaning TradFi — traditional assets gaining ground',
    'tradfi dominant':'▼ TradFi in charge — institutional flavour today'};
  document.getElementById('gauge-tagline').innerHTML = '<strong>' + taglines[dominance] + '</strong>';
  document.getElementById('gauge-needle-val').textContent = cryptoPct.toFixed(1) + '% Crypto';
  document.getElementById('gauge-needle-sub').textContent = $u(totalVol) + ' total vol';
  document.getElementById('gauge-tf-note').textContent =
    'Timeframe: ' + ({'1D':'24h','7D':'7 days','30D':'30 days'}[S.tf]||'24h') + ' · Data: Hyperliquid public API';

  const canvas = document.getElementById('vibe-gauge');
  if (!canvas) return;
  canvas.setAttribute('role','img');
  canvas.setAttribute('aria-label',
    `Half-circle gauge: ${cryptoPct.toFixed(1)}% Crypto (${$u(catVol['Crypto']||0)}) vs ${tradfiPct.toFixed(1)}% TradFi (${$u(catVol['TradFi']||0)}) — total volume ${$u(totalVol)}`);

  // Destroy previous chart instance
  if (window._vibeChart) { window._vibeChart.destroy(); window._vibeChart = null; }

  // Chart.js half-donut:
  // rotation: -90deg (starts at 9 o'clock = left)
  // circumference: 180deg (half circle only)
  // Data: [TradFi, Crypto] — TradFi on left, Crypto on right
  window._vibeChart = new Chart(canvas, {
    type: 'doughnut',
    data: {
      labels: ['TradFi', 'Crypto'],
      datasets: [{
        data: [tradfiPct, cryptoPct],
        backgroundColor: ['#e8833a', '#4fd2c2'],
        borderColor: ['#0a1410', '#0a1410'],
        borderWidth: 3,
        hoverOffset: 0,
      }]
    },
    options: {
      rotation: -90,          // start at left (9 o'clock)
      circumference: 180,     // only draw top half
      cutout: '60%',          // donut hole size
      responsive: true,
      maintainAspectRatio: true,
      aspectRatio: 2,         // width:height = 2:1 → perfect half-circle shape
      animation: { duration: 600, easing: 'easeInOutQuart' },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#01241d',
          borderColor: 'rgba(79,210,194,0.3)',
          borderWidth: 1,
          titleColor: '#4fd2c2',
          bodyColor: '#f0faf8',
          callbacks: {
            label: ctx => ` ${ctx.label}: ${ctx.raw.toFixed(1)}%  (${$u(catVol[ctx.label]||0)})`
          }
        }
      }
    }
  });
}

function switchPage(page) {
  document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(el => el.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  document.querySelectorAll('.nav-tab').forEach(el => {
    if (el.textContent.toLowerCase().includes(page === 'dashboard' ? 'dash' : 'asset')) {
      el.classList.add('active');
    }
  });
  if (page === 'docs') renderDocs();
}
